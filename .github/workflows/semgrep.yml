name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '30 6 * * 1'

jobs:
  semgrep:
    name: Security Scan (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Semgrep
        run: |
          # --config=auto exige les metriques (anonymes - stats d'usage
          # des regles, jamais le code source) : Semgrep refuse de
          # resoudre la config auto si --metrics=off. Reste "on" ici
          # uniquement pour ce step, --metrics=off n'est pas une option
          # viable avec auto (echec constate en CI : "Cannot create auto
          # config when metrics are off").
          semgrep scan \
            --config=auto \
            --config=p/secrets \
            --config=p/github-actions \
            --error \
            .
