name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for external repo/issue references (leak guard)
        shell: bash
        env:
          REPO_SELF: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -e
          PATTERN='[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+'
          URL_PATTERN='github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/(issues|pull)/[0-9]+'

          {
            printf '%s\n' "$PR_TITLE"
            printf '%s\n' "$PR_BODY"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              git log --format='%s%n%b' "origin/${PR_BASE_REF}..HEAD"
            else
              if [ -z "$PUSH_BEFORE" ] || [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
                git log -1 --format='%s%n%b'
              else
                git log --format='%s%n%b' "${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
            fi
          } > /tmp/leak-check-text.txt

          HIT=$(grep -oE "$PATTERN" /tmp/leak-check-text.txt | grep -vi "^${REPO_SELF}#" || true)
          if [ -n "$HIT" ]; then
            echo "::error::Reference courte vers un depot externe trouvee dans un message de commit ou une PR : $HIT"
            echo "Decrire le canal/l'issue en prose plutot que par sa reference courte ou son URL."
            exit 1
          fi

          HIT=$(grep -oE "$URL_PATTERN" /tmp/leak-check-text.txt | grep -vi "github.com/${REPO_SELF}/" || true)
          if [ -n "$HIT" ]; then
            echo "::error::URL vers une issue/PR externe trouvee dans un message de commit ou une PR : $HIT"
            echo "Decrire le canal/l'issue en prose plutot que par sa reference courte ou son URL."
            exit 1
          fi

          echo "Aucune reference courte ni URL vers un depot externe trouvee."

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $script:failed = $false
          Get-ChildItem -Recurse -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
              $script:failed = $true
            }
          }
          if ($script:failed) { exit 1 }
          Write-Host "All PowerShell files are syntactically valid."

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # Exclude rules that are deliberately acceptable in this project:
          # - PSUseShouldProcessForStateChangingFunctions: cmdlet convention not required here
          # - PSAvoidUsingWriteHost: Write-Host is intentional for interactive terminal UI
          # - PSAvoidGlobalVars: $Global:WSLRoot is the documented cross-module contract
          # - PSUseSingularNouns: Import-Profiles / Export-Profiles handle multiple profiles by design
          # - PSUseBOMForUnicodeEncodedFile: files are UTF-8 without BOM by project convention
          # - PSAvoidOverwritingBuiltInCmdlets: wisely.ps1 intentionally shadows Write-Host to
          #   implement -Quiet without touching ~90 existing call sites (see wisely.ps1 comment)
          $excludeRules = @(
            'PSUseShouldProcessForStateChangingFunctions',
            'PSAvoidUsingWriteHost',
            'PSAvoidGlobalVars',
            'PSUseSingularNouns',
            'PSUseBOMForUnicodeEncodedFile',
            'PSAvoidOverwritingBuiltInCmdlets'
          )
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning -ExcludeRule $excludeRules
          if ($results.Count -gt 0) {
            $results | ForEach-Object {
              Write-Host "::error file=$($_.ScriptPath),line=$($_.Line)::[$($_.RuleName)] $($_.Message)"
            }
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no warnings or errors found."

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -Repository PSGallery -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = "tests"
          $config.Run.PassThru = $true
          $config.Output.Verbosity = "Detailed"
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            Write-Host "::error::$($result.FailedCount) Pester test(s) failed."
            exit 1
          }
          Write-Host "Pester: $($result.PassedCount) test(s) passed, 0 failed."

      - name: Validate profiles.json
        shell: pwsh
        run: |
          $json = Get-Content data/profiles.json -Raw
          if (-not (Test-Json -Json $json -SchemaFile schemas/profiles.schema.json)) {
            throw "profiles.json does not match schemas/profiles.schema.json"
          }
          $parsed = $json | ConvertFrom-Json
          Write-Host "profiles.json is valid (version $($parsed.version), $(@($parsed.profiles.PSObject.Properties).Count) profile(s))."
