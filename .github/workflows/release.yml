name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.1.0). Needed for reruns: a tag pushed with the default GITHUB_TOKEN (e.g. by bump-version.yml) does not auto-trigger this workflow, so it must be relaunched manually for that tag."
        required: false
        type: string

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve target tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="$REF_NAME"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Verify VERSION matches the release tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          EXPECTED="${TAG#v}"
          ACTUAL="${{ steps.version.outputs.version }}"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::VERSION ($ACTUAL) ne correspond pas au tag ($TAG, attendu $EXPECTED) - l'archive publiee contiendrait un VERSION desynchronise."
            exit 1
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES=$(awk "/^## ${TAG} /{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          zip -r "wisely-${{ steps.tag.outputs.tag }}.zip" \
            wisely.ps1 \
            data/profiles.json \
            modules/ \
            VERSION \
            CHANGELOG.md \
            README.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Wisely ${{ steps.tag.outputs.tag }}" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            "wisely-${{ steps.tag.outputs.tag }}.zip"
